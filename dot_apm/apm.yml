name: icchankun
version: 1.0.0
description: APM project for icchankun
author: icchankun
targets:
  - claude
dependencies:
  apm:
    # my skills
    - git: icchankun/skills
      ref: main
    # 3rd-party
    - git: GoogleChrome/modern-web-guidance
      ref: 5733cdd9f89b0f19119e855532f8b8ac7997ecb6
      skills:
        - modern-web-guidance
    - git: microsoft/playwright-cli
      ref: b85c7a736bb473bf55b584e54a09ffa698d6d871 # v0.1.22
      skills:
        - playwright-cli
    # 拡張本体は `gh extension install github/gh-stack` が別途必要
    - git: github/gh-stack
      ref: 29a36d314be664583705f18e41cebdf2b61ad514 # v0.2.1
      skills:
        - gh-stack
    # skill の内容は `herdr --skill` の出力と同一。本体を更新したら ref も揃える
    - git: herdrdev/herdr
      ref: 065ef9d6a531c49fb8bee7e818ef837065b21ee9 # v0.9.1
      skills:
        - herdr
    # インストールは `npx skills add` を使わず、この apm.yml に追記する
    - git: vercel-labs/skills
      ref: a80e4c9d12d607631249d4d7d059f835d4b2f13a # v1.7.4
      skills:
        - find-skills
    - git: cursor/plugins
      ref: e46364b8be46000b7df0f260550cd712afbb8d36
      path: pstack
      skills:
        - typescript-best-practices
    # official plugins（skills/commands/agents のみ）
    # hooks 系（security-guidance）と LSP 系（ruby-lsp, typescript-lsp）は
    # settings.json の enabledPlugins で管理。pr-review-toolkit も同様で、
    # herdr-coding が /pr-review-toolkit:review-pr の名前で呼ぶうえ、
    # apm で入れると agents/code-reviewer.md が feature-dev のものとぶつかる。
    # hooks: apm は hooks/ 内のスクリプトのみ展開し core/ 等の依存を含めない。
    # LSP: 空リポジトリのため展開物がない。
    - git: anthropics/claude-plugins-official
      path: plugins/agent-sdk-dev
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/claude-code-setup
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/claude-md-management
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/code-modernization
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/code-review
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/feature-dev
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/frontend-design
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/mcp-tunnels
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/playground
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/project-artifact
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/session-report
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
  mcp:
    - name: aws-documentation
      registry: false
      transport: stdio
      command: uvx
      args: ["awslabs.aws-documentation-mcp-server@latest"]
      env:
        FASTMCP_LOG_LEVEL: ERROR
        AWS_DOCUMENTATION_PARTITION: aws
    - name: gitmcp
      registry: false
      transport: http
      url: https://gitmcp.io/docs
includes: auto
scripts: {}
