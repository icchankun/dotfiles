name: icchankun
version: 1.0.0
description: APM project for icchankun
author: icchankun
targets:
  - claude
  - codex
dependencies:
  apm:
    - git: icchankun/skills
      ref: main
    - git: GoogleChrome/modern-web-guidance
      ref: 5733cdd9f89b0f19119e855532f8b8ac7997ecb6
      skills:
        - modern-web-guidance
    - git: microsoft/playwright-cli
      ref: b85c7a736bb473bf55b584e54a09ffa698d6d871 # v0.1.22
      skills:
        - playwright-cli
    # 拡張本体は `gh extension install github/gh-stack` が別途必要
    - git: github/gh-stack
      ref: 29a36d314be664583705f18e41cebdf2b61ad514 # v0.2.1
      skills:
        - gh-stack
    # Herdr.app の terminal を動かす hc の skill。本体を更新したら ref も揃える
    - git: herdrdev/herdr-core
      ref: 9e934dff8513710d3c5111fe28bc5b23564805db # v0.1.15
      skills:
        - herdr-core
    - git: vercel-labs/skills
      ref: a80e4c9d12d607631249d4d7d059f835d4b2f13a # v1.7.4
      skills:
        - find-skills
    # 新しい作業の依頼を、作業の前に整える。~/.bin/prompt-tune-hook が呼ぶ
    - git: nidhinjs/prompt-master
      ref: 49b3a72469b1e7287d66387004ccfcca90e5968a # v1.8.2
    # grill-with-docs が grilling と domain-modeling を呼ぶので、まとめて入れる
    - git: mattpocock/skills
      ref: 4ae2317ddb22b046e26455e4f9c9b3aaaf62212d
      skills:
        - grilling
        - grill-with-docs
        - domain-modeling
        - to-questionnaire
    # 実装の前の設計と、出す前の確認。ほかの engineering の skill は手持ちの skill とかぶるので入れない。
    # path: engineering で入れると plugin の .mcp.json（slack や github など8つ）まで入るので、skill を1つずつ指す
    - git: anthropics/knowledge-work-plugins
      ref: e050c2ec856373787143d7057663a6ebd1277df3
      path: engineering/skills/testing-strategy
    - git: anthropics/knowledge-work-plugins
      ref: e050c2ec856373787143d7057663a6ebd1277df3
      path: engineering/skills/deploy-checklist
    - git: anthropics/knowledge-work-plugins
      ref: e050c2ec856373787143d7057663a6ebd1277df3
      path: engineering/skills/system-design
    - git: cursor/plugins
      ref: e46364b8be46000b7df0f260550cd712afbb8d36
      path: pstack
      skills:
        - typescript-best-practices
    # ここに並べる official plugins は skills/commands/agents だけのもの。次の3種類は apm では入れず、settings.json の enabledPlugins で入れる
    # - hooks を持つ plugin：apm は hooks/ 内のスクリプトしか展開せず、core/ などの依存が入らない
    # - LSP の ruby-lsp, typescript-lsp：リポジトリが空で、apm では何も展開されない
    # - pr-review-toolkit：herdr-coding が /pr-review-toolkit:review-pr の名前で呼ぶ
    - git: anthropics/claude-plugins-official
      path: plugins/code-review
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/frontend-design
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/playground
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/project-artifact
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
    - git: anthropics/claude-plugins-official
      path: plugins/session-report
      ref: 57446951ad09cb8d9e7e4820f08dcba34c2d20a2
  # AWS のドキュメントは deploy-on-aws plugin の awsknowledge で引く
  mcp: []
includes: auto
scripts: {}
