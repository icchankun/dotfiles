[settings]
# 各言語の慣例バージョンファイル（.node-version, .python-version, .ruby-version 等）を mise で読み込む
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]
# リリースから3日未満のバージョンを無視（サプライチェーン対策）
minimum_release_age = "3d"

[tools]
node = "latest"
python = "latest"
ruby = "latest"
betterleaks = "latest"
"github:microsoft/apm" = "0.31.0"
# capturing-screens が画面の撮影に使う
"npm:@playwright/cli" = "latest"
lazygit = "latest"
ffmpeg = "latest"
gh = "latest"
# pipx の backend が使う
uv = "latest"
# コードのグラフを手元で作る（解析に LLM を使わない）。skill の登録は run_onchange_after_install-graphify.sh
"pipx:graphifyy" = "0.9.97"
# zsh が使う（dot_zshrc, dot_zsh/）。zinit は mise で入らないので dot_zshrc が clone する
peco = "latest"
zoxide = "latest"
direnv = "latest"
"github:k1LoW/git-wt" = "latest"
jq = "latest"
fzf = "latest"
# Claude Code の statusLine（dot_claude/settings.json）が動かす
"npm:ccstatusline" = "latest"
